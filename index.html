<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Xiang Zhang — cybersecurity researcher and network security engineer.">
  <title>Xiang Zhang — Security Research</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #050505;
      --surface: #0b0b0b;
      --surface-raised: #111;
      --text: #f2f2f2;
      --muted: #9b9b9b;
      --dim: #696969;
      --line: #2a2a2a;
      --prompt: #d8d8d8;
      --max-width: 1040px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--background);
    }

    body {
      min-height: 100dvh;
      color: var(--text);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input {
      font: inherit;
    }

    a {
      color: var(--text);
      text-decoration-color: var(--dim);
      text-underline-offset: 3px;
    }

    a:hover,
    a:focus-visible {
      text-decoration-color: var(--text);
    }

    .page {
      display: grid;
      min-height: 100dvh;
      place-items: center;
      padding: clamp(12px, 3vw, 36px);
    }

    .terminal {
      display: grid;
      width: min(100%, var(--max-width));
      height: min(760px, calc(100dvh - clamp(24px, 6vw, 72px)));
      grid-template-rows: 42px minmax(0, 1fr) auto;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.45);
    }

    .terminal-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      min-width: 0;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-raised);
    }

    .terminal-dots {
      display: flex;
      gap: 7px;
    }

    .terminal-dots span {
      width: 8px;
      height: 8px;
      border: 1px solid #606060;
      border-radius: 50%;
    }

    .terminal-title {
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .terminal-output {
      min-height: 0;
      overflow: auto;
      padding: clamp(18px, 3vw, 32px);
      scrollbar-color: #444 transparent;
      scrollbar-width: thin;
    }

    .terminal-output::-webkit-scrollbar {
      width: 6px;
    }

    .terminal-output::-webkit-scrollbar-thumb {
      border-radius: 6px;
      background: #444;
    }

    .command-line,
    .input-line {
      display: flex;
      align-items: baseline;
      gap: 9px;
    }

    .prompt {
      flex: 0 0 auto;
      color: var(--prompt);
      font-weight: 600;
    }

    .command {
      color: var(--text);
    }

    .result {
      margin: 10px 0 28px 0;
    }

    .identity {
      margin-bottom: 24px;
    }

    .name {
      margin: 0 0 2px;
      font-family: inherit;
      font-size: clamp(25px, 4vw, 43px);
      font-weight: 600;
      letter-spacing: -0.055em;
      line-height: 1.15;
    }

    .role {
      margin: 0 0 15px;
      color: var(--muted);
      font-size: 13px;
    }

    .summary {
      max-width: 760px;
      margin: 0;
      color: #d0d0d0;
    }

    .file-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(max-content, 1fr));
      gap: 6px 18px;
      margin: 10px 0 20px;
      color: #d8d8d8;
    }

    .available {
      color: var(--dim);
      font-size: 12px;
    }

    .content-block {
      max-width: 860px;
    }

    .content-block p {
      margin: 0 0 12px;
    }

    .content-block p:last-child {
      margin-bottom: 0;
    }

    .section-label {
      color: var(--muted);
    }

    .entry {
      display: grid;
      grid-template-columns: minmax(110px, 145px) minmax(0, 1fr);
      gap: 8px 18px;
      margin-bottom: 14px;
    }

    .entry:last-child {
      margin-bottom: 0;
    }

    .entry-key {
      color: var(--muted);
    }

    .entry-value strong {
      display: block;
      margin-bottom: 2px;
      color: var(--text);
      font-weight: 600;
    }

    .entry-value span,
    .publication-note {
      color: #b7b7b7;
    }

    .terminal-input {
      padding: 15px clamp(18px, 3vw, 32px);
      border-top: 1px solid var(--line);
      background: var(--surface-raised);
    }

    #command-input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      caret-color: var(--text);
    }

    #command-input::placeholder {
      color: #555;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 720px) {
      body {
        font-size: 12px;
      }

      .page {
        padding: 0;
      }

      .terminal {
        width: 100%;
        height: 100dvh;
        border: 0;
        border-radius: 0;
      }

      .file-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .entry {
        grid-template-columns: 1fr;
        gap: 1px;
      }
    }

    @media (max-height: 620px) {
      .terminal {
        height: calc(100dvh - 16px);
      }

      .terminal-output {
        padding-top: 16px;
        padding-bottom: 16px;
      }

      .result {
        margin-bottom: 18px;
      }

      .identity {
        margin-bottom: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="terminal" aria-label="Interactive portfolio terminal">
      <header class="terminal-bar">
        <div class="terminal-dots" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="terminal-title">xiang@security: ~</div>
        <div></div>
      </header>

      <div id="terminal-output" class="terminal-output" aria-live="polite"></div>

      <form id="terminal-form" class="terminal-input" autocomplete="off">
        <label class="sr-only" for="command-input">Terminal command</label>
        <div class="input-line">
          <span class="prompt" aria-hidden="true">xiang@security:~$</span>
          <input
            id="command-input"
            name="command"
            type="text"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            placeholder="type a command"
            autofocus
          >
        </div>
      </form>
    </section>
  </main>

  <template id="home-template">
    <div class="command-line">
      <span class="prompt">xiang@security:~$</span>
      <span class="command">whoami</span>
    </div>
    <div class="result">
      <div class="identity">
        <h1 class="name">Xiang Zhang</h1>
        <p class="role">Cybersecurity researcher / Network security engineer</p>
        <p class="summary">I work on attack-surface analysis, network and systems security, and AI-assisted security analysis.</p>
      </div>
      <div class="command-line">
        <span class="prompt">xiang@security:~$</span>
        <span class="command">ls</span>
      </div>
      <div class="file-grid" aria-label="Available files">
        <span>about.txt</span>
        <span>research.txt</span>
        <span>publication.txt</span>
        <span>experience.txt</span>
        <span>contacts.txt</span>
      </div>
      <div class="available">available commands: whoami&nbsp;&nbsp;ls&nbsp;&nbsp;cat</div>
    </div>
  </template>

  <template id="ls-template">
    <div class="file-grid" aria-label="Available files">
      <span>about.txt</span>
      <span>research.txt</span>
      <span>publication.txt</span>
      <span>experience.txt</span>
      <span>contacts.txt</span>
    </div>
  </template>

  <template id="about-template">
    <div class="content-block">
      <p>My background spans knowledge-graph-based asset discovery, enterprise network security, CTF competitions, and vulnerability analysis.</p>
      <div class="entry">
        <span class="entry-key">education</span>
        <div class="entry-value">
          <strong>M.Sc. Cybersecurity</strong>
          <span>University of Chinese Academy of Sciences</span>
        </div>
      </div>
      <div class="entry">
        <span class="entry-key">education</span>
        <div class="entry-value">
          <strong>B.Sc. Cybersecurity</strong>
          <span>Central South University</span>
        </div>
      </div>
      <div class="entry">
        <span class="entry-key">current role</span>
        <div class="entry-value">
          <strong>Network Security Engineer</strong>
          <span>E Fund Management</span>
        </div>
      </div>
      <div class="entry">
        <span class="entry-key">community</span>
        <div class="entry-value">
          <strong>Former member</strong>
          <span>CTF team Never Stop Exploiting</span>
        </div>

    </div>
  </template>

    <div class="content-block">

        <div class="entry-value"><span>Cross-layer analysis of exposure, reachability, identity, vulnerabilities, and security controls.</span></div>

      <div class="entry">
        <span class="entry-key">AI for Security</span>
        <div class="entry-value"><span>Using AI to interpret heterogeneous security data while grounding conclusions in system evidence.</span></div>

      <div class="entry">

        <div class="entry-value"><span>Studying how infrastructure state and application behavior combine to form practical attack paths.</span></div>

      <p><a href="https://doi.org/10.1007/978-3-030-95391-1_7" target="_blank" rel="noreferrer">doi:10.1007/978-3-030-95391-1_7</a></p>

  <template id="experience-template">
    <div class="content-block">
      <div class="entry">

      </div>

  <template id="contacts-template">
    <div class="content-block">
      <div class="entry">
        <span class="entry-key">Google Scholar</span>
        <div class="entry-value"><a href="https://scholar.google.com/citations?user=PVjI030AAAAJ&amp;hl=en" target="_blank" rel="noreferrer">scholar.google.com/citations?user=PVjI030AAAAJ</a></div>
      </div>
      <div class="entry">

        <div class="entry-value"><a href="https://github.com/Mote-Z" target="_blank" rel="noreferrer">github.com/Mote-Z</a></div>

      <div class="entry">
        <span class="entry-key">LinkedIn</span>
        <div class="entry-value"><a href="https://www.linkedin.com/in/xiang-zhang-moteorz/" target="_blank" rel="noreferrer">linkedin.com/in/xiang-zhang-moteorz</a></div>
      </div>
      <div class="entry">
        <span class="entry-key">Email</span>
        <div class="entry-value"><a href="mailto:mote.orzzz@gmail.com">mote.orzzz@gmail.com</a></div>
      </div>
    </div>
  </template>

  <script>
    (() => {
      "use strict";

      const output = document.getElementById("terminal-output");
      const form = document.getElementById("terminal-form");
      const input = document.getElementById("command-input");

      const files = {
        "about.txt": "about-template",
        "research.txt": "research-template",
        "publication.txt": "publication-template",
        "experience.txt": "experience-template",
        "contacts.txt": "contacts-template"
      };

      const completionCommands = [
        "whoami",
        "ls",
        "cat about.txt",
        "cat research.txt",
        "cat publication.txt",
        "cat experience.txt",
        "cat contacts.txt"
      ];

      let lastCommand = "";

      function cloneTemplate(id) {
        return document.getElementById(id).content.cloneNode(true);
      }

      function showHome() {
        output.replaceChildren(cloneTemplate("home-template"));
        output.scrollTop = 0;
      }

      function appendCommand(command) {
        const line = document.createElement("div");
        line.className = "command-line";

        const prompt = document.createElement("span");
        prompt.className = "prompt";
        prompt.textContent = "xiang@security:~$";

        const value = document.createElement("span");
        value.className = "command";
        value.textContent = command;

        line.append(prompt, value);
        output.append(line);
      }

      function appendResult(templateId) {
        const result = document.createElement("div");
        result.className = "result";
        result.append(cloneTemplate(templateId));
        output.append(result);
        output.scrollTop = output.scrollHeight;
      }

      function runCommand(rawCommand) {
        const command = rawCommand.trim().replace(/\s+/g, " ");
        if (!command) return;

        lastCommand = command;
        const parts = command.split(" ");
        const action = parts[0].toLowerCase();

        if (action === "whoami" && parts.length === 1) {
          showHome();
          return;
        }

        if (action === "ls" && parts.length === 1) {
          appendCommand(command);
          appendResult("ls-template");
          return;
        }

        if (action === "cat" && parts.length === 2) {
          const requested = parts[1].toLowerCase();
          const filename = requested.endsWith(".txt") ? requested : `${requested}.txt`;
          const templateId = files[filename];

          if (templateId) {
            appendCommand(command);
            appendResult(templateId);
            return;
          }
        }

        showHome();
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        runCommand(input.value);
        input.value = "";
      });

      input.addEventListener("keydown", (event) => {
        if (event.key === "ArrowUp") {
          event.preventDefault();
          input.value = lastCommand;
          input.setSelectionRange(input.value.length, input.value.length);
          return;
        }

        if (event.key === "Tab") {
          event.preventDefault();
          const value = input.value.trim().toLowerCase();
          if (!value) return;

          const matches = completionCommands.filter((command) => command.startsWith(value));
          if (matches.length === 1) {
            input.value = matches[0];
            input.setSelectionRange(input.value.length, input.value.length);
          }
        }
      });

      document.querySelector(".terminal").addEventListener("click", (event) => {
        if (!(event.target instanceof HTMLAnchorElement)) input.focus();
      });

      showHome();
    })();
  </script>
</body>
</html>
