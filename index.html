<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Xiang Zhang is a cybersecurity researcher and network security engineer working on attack surfaces, security architecture, AI-assisted security analysis, and secure NetOps.">
  <title>Xiang Zhang — Security Research &amp; Engineering</title>
  <style>
    :root {
      --ink: #f0f0ed;
      --soft: #b2b2ad;
      --muted: #777772;
      --line: #2a2a28;
      --panel: #0a0a09;
      --raised: #10100f;
      --background: #030303;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--background); }

    body {
      color: var(--ink);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }

    .page-shell {
      display: grid;
      min-height: 100dvh;
      place-items: center;
      padding: clamp(12px, 3vw, 34px);
      background: radial-gradient(circle at 50% -20%, rgba(255,255,255,.055), transparent 42%), var(--background);
    }

    .terminal {
      display: grid;
      grid-template-rows: 43px minmax(0, 1fr) auto;
      width: min(1120px, 100%);
      height: min(790px, calc(100dvh - clamp(24px, 6vw, 68px)));
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 30px 100px rgba(0,0,0,.62);
    }

    .terminal-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 15px;
      border-bottom: 1px solid var(--line);
      background: var(--raised);
    }

    .terminal-bar p { margin: 0; color: var(--soft); font-size: 12px; }
    .terminal-dots { display: flex; gap: 7px; }
    .terminal-dots span { width: 9px; height: 9px; border-radius: 999px; }
    .terminal-dots span:nth-child(1) { background: #ff5f57; box-shadow: inset 0 0 0 1px #e0443e; }
    .terminal-dots span:nth-child(2) { background: #febc2e; box-shadow: inset 0 0 0 1px #d89e24; }
    .terminal-dots span:nth-child(3) { background: #28c840; box-shadow: inset 0 0 0 1px #1faa33; }
    .status { justify-self: end; color: #4bd264; font-size: 9px; letter-spacing: .16em; text-shadow: 0 0 10px rgba(75,210,100,.22); }

    .terminal-output {
      min-height: 0;
      overflow: auto;
      padding: clamp(22px, 4vw, 44px);
      scrollbar-color: #3f3f3b transparent;
      scrollbar-width: thin;
    }

    .terminal-output::-webkit-scrollbar { width: 6px; }
    .terminal-output::-webkit-scrollbar-thumb { border-radius: 6px; background: #3f3f3b; }
    .history-item + .history-item { margin-top: 30px; }
    .prompt-line, .terminal-input { display: flex; align-items: baseline; gap: 10px; }
    .prompt { flex: 0 0 auto; color: #d2d2ce; font-weight: 600; }
    .command { color: var(--ink); }
    .result { max-width: 920px; margin: 15px 0 0; }

    .hero-heading { padding-top: 6px; }
    .hero-heading h1 { margin: 0; font-size: clamp(34px, 6vw, 64px); font-weight: 550; letter-spacing: -.065em; line-height: 1; }
    .role { margin: 9px 0 0; color: var(--soft); font-size: clamp(12px, 1.5vw, 15px); }
    .social-links { display: flex; gap: 7px; margin-top: 13px; }
    .social-links a { display: grid; width: 30px; height: 30px; place-items: center; border: 1px solid #30302d; color: #8e8e88; font-size: 11px; font-weight: 600; text-decoration: none; transition: border-color 150ms ease, background 150ms ease, color 150ms ease, transform 150ms ease; }
    .social-links a:hover, .social-links a:focus-visible { border-color: #73736d; outline: none; background: #151513; color: var(--ink); transform: translateY(-1px); }
    .focus-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 20px; }
    .focus-row span { padding: 4px 9px; border: 1px solid #31312e; color: #aaa9a3; font-size: 11px; letter-spacing: .045em; text-transform: uppercase; }
    .thesis { max-width: 810px; margin: 25px 0 0; color: #d5d5d0; font-family: Arial, sans-serif; font-size: clamp(16px, 2vw, 20px); line-height: 1.55; }
    .thesis strong { color: #f3f3ef; font-weight: 650; }
    .thesis em { color: #e2e2dc; }
    .personal-note { max-width: 810px; margin: 14px 0 0; color: #85857f; font-size: 12px; line-height: 1.65; }
    .home-ls { margin-top: 30px; }

    .file-list { display: grid; grid-template-columns: repeat(4, minmax(max-content, 1fr)); gap: 4px 28px; margin-top: 8px; }
    .file-list span { min-width: 0; overflow: hidden; color: #c6c6c0; font-size: 12px; text-overflow: ellipsis; }
    .hint { margin: 13px 0 0; color: #666661; font-size: 11px; }
    kbd { padding: 1px 4px; border: 1px solid #30302d; color: #93938d; font-family: inherit; }

    .file-content { color: #c9c9c4; }
    .research-lead { max-width: 820px; margin: 0 0 17px; color: #d4d4cf; font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; }
    .research-lead strong { color: #f3f3ef; font-weight: 650; }
    .research-lead em { color: #e2e2dc; }
    .research-grid article { display: grid; grid-template-columns: 48px 1fr; gap: 14px; padding: 18px 0; border-top: 1px solid #242422; }
    .research-grid .index { color: #5f5f5a; font-size: 11px; }
    .file-content h2 { margin: 0; color: var(--ink); font-size: 15px; font-weight: 600; }
    .file-content article p { max-width: 800px; margin: 6px 0 0; color: #aaa9a3; }

    .publication { max-width: 840px; }
    .publication h2 { max-width: 760px; font-family: Arial, sans-serif; font-size: clamp(20px, 3vw, 29px); line-height: 1.25; }
    .publication > p:not(.meta):not(.authors) { max-width: 700px; }
    .meta { margin: 0 0 10px; color: #6f6f69; font-size: 10px; letter-spacing: .1em; }
    .authors { color: #8e8e88; }
    .text-link { display: inline-block; margin-top: 10px; color: #e6e6e1; text-decoration: underline; text-decoration-color: #55554f; text-underline-offset: 4px; }
    .text-link:hover, .text-link:focus-visible { text-decoration-color: #fff; }
    .timeline article { padding: 16px 0 19px; border-top: 1px solid #242422; }
    .timeline article:first-child { border-top-color: #4b4b47; }
    .error { color: #a88787; }

    .terminal-input { padding: 15px clamp(22px, 4vw, 44px); border-top: 1px solid var(--line); background: var(--raised); }
    .terminal-input input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); caret-color: #fff; }
    .terminal-input input::placeholder { color: #4f4f4b; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    @media (max-width: 760px) {
      body { font-size: 12px; }
      .page-shell { padding: 0; }
      .terminal { width: 100%; height: 100dvh; border: 0; border-radius: 0; }
      .terminal-bar { grid-template-columns: auto 1fr auto; gap: 14px; }
      .file-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .thesis { font-size: 16px; }
    }

    @media (max-width: 470px) {
      .terminal-output { padding: 21px 17px; }
      .terminal-input { padding: 14px 17px; }
      .prompt-line, .terminal-input { gap: 7px; }
      .prompt { font-size: 10px; }
      .hint { line-height: 1.8; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <section class="terminal" id="terminal" aria-label="Interactive portfolio terminal">
      <header class="terminal-bar">
        <div class="terminal-dots" aria-hidden="true"><span></span><span></span><span></span></div>
        <p>xiang@security: ~</p>
        <span class="status">ONLINE</span>
      </header>

      <div class="terminal-output" id="terminal-output" aria-live="polite"></div>

      <form class="terminal-input" id="terminal-form" autocomplete="off">
        <label class="sr-only" for="command-input">Terminal command</label>
        <span class="prompt" aria-hidden="true">xiang@security:~$</span>
        <input id="command-input" placeholder="type a command" spellcheck="false" autocapitalize="off" autofocus>
      </form>
    </section>
  </main>

  <template id="home-template">
    <div class="result home-result">
      <div class="hero-heading">
        <h1>Xiang Zhang</h1>
        <p class="role">Cybersecurity Researcher / Enterprise Security &amp; NetOps Engineer</p>
        <nav class="social-links" aria-label="Contact and academic profiles">
          <a href="mailto:mote.orzzz@gmail.com" aria-label="Email Xiang Zhang" title="Email">@</a>
          <a href="https://scholar.google.com/citations?user=PVjI030AAAAJ&amp;hl=en" target="_blank" rel="noreferrer" aria-label="Google Scholar profile" title="Google Scholar">GS</a>
          <a href="https://github.com/Mote-Z" target="_blank" rel="noreferrer" aria-label="GitHub profile" title="GitHub">GH</a>
          <a href="https://www.linkedin.com/in/xiang-zhang-moteorz/" target="_blank" rel="noreferrer" aria-label="LinkedIn profile" title="LinkedIn">in</a>
        </nav>
      </div>

      <div class="focus-row" aria-label="Core focus areas">
        <span>Network Security</span><span>AI for Security</span><span>Enterprise Security</span><span>Security Architecture</span><span>NetOps</span>
      </div>

      <p class="thesis">My research focuses on the intersection of <strong>Network Security</strong>, <strong>Enterprise Security Architecture</strong>, <strong>AI for Security</strong>, and <strong>NetOps</strong>. I study how <strong>AI-assisted, evidence-grounded methods</strong> can connect identities, assets, vulnerabilities, network topology, access policies, and telemetry to <em>discover attack surfaces</em>, <em>validate attack paths</em>, and support <em>explainable, policy-aligned security operations</em>.</p>

      <p class="personal-note">Outside research and engineering, I share my home with three adorable cats. I also enjoy travelling, experiencing different cultures, and learning about the history of the places I visit.</p>

      <div class="home-ls"><div class="prompt-line"><span class="prompt">xiang@security:~$</span><span class="command">ls</span></div><div class="file-list"><span>education.txt</span><span>career.txt</span><span>research.txt</span><span>publication.txt</span></div></div>
      <p class="hint">Type <kbd>cat research.txt</kbd> to open a file. Use <kbd>Tab</kbd> to complete and <kbd>↑</kbd> for history.</p>
    </div>
  </template>

  <template id="education-template">
    <div class="result"><div class="file-content timeline">
      <article><p class="meta">2019—2021</p><h2>M.Sc. in Cybersecurity</h2><p>University of Chinese Academy of Sciences</p></article>
      <article><p class="meta">BEFORE 2019</p><h2>B.Sc. in Cybersecurity</h2><p>Central South University</p></article>
    </div></div>
  </template>

  <template id="career-template">
    <div class="result"><div class="file-content timeline">
      <article><p class="meta">2022—PRESENT</p><h2>Network Security Engineer</h2><p>E Fund Management</p></article>
    </div></div>
  </template>

  <template id="research-template">
    <div class="result"><div class="file-content research">
      <p class="research-lead">From an <strong>offensive-and-defensive perspective</strong>, I study how verifiable enterprise evidence can support <em>proactive, explainable security decisions</em>.</p>
      <div class="research-grid">
        <article><span class="index">01</span><div><h2>Enterprise Asset Intelligence &amp; Attack Surface</h2><p>Fuse heterogeneous observations to map assets, dependencies, exposure, and reachability—revealing unmanaged assets and validating realistic attack paths across enterprise environments.</p></div></article>
        <article><span class="index">02</span><div><h2>Identity-Centric Security Architecture</h2><p>Explore Zero Trust and context-aware access control that moves security from network boundaries towards identity, application, device posture, and continuously evaluated risk.</p></div></article>
        <article><span class="index">03</span><div><h2>Evidence-Grounded Intelligent Security Operations</h2><p>Connect assets, topology, policies, vulnerabilities, and telemetry with knowledge graphs and LLM-based agents for traceable attack-path analysis and policy-aligned response.</p></div></article>
        <article><span class="index">04</span><div><h2>Intelligent &amp; Secure NetOps</h2><p>Build automated, AI-assisted NetOps with security by design—shifting risk checks into the request stage, analysing policies across environments, and making secure changes more efficient.</p></div></article>
      </div>
    </div></div>
  </template>

  <template id="publication-template">
    <div class="result"><div class="file-content publication">
      <p class="meta">ICA3PP · Springer · 2021</p>
      <h2>Auto-Recon: An Automated Network Reconnaissance System Based on Knowledge Graph</h2>
      <p class="authors">Xiang Zhang, Qingli Guo, Yuan Liu, Xiaorui Gong</p>
      <p>A knowledge-graph-based system that organizes reconnaissance evidence and supports automated asset discovery from an attacker-oriented perspective.</p>
      <a class="text-link" href="https://doi.org/10.1007/978-3-030-95391-1_7" target="_blank" rel="noreferrer">Read publication ↗</a>
    </div></div>
  </template>

  <script>
    (() => {
      const files = ["education.txt", "career.txt", "research.txt", "publication.txt"];
      const completions = ["whoami", "ls", ...files.map(file => `cat ${file}`)];
      const output = document.getElementById("terminal-output");
      const form = document.getElementById("terminal-form");
      const input = document.getElementById("command-input");
      const terminal = document.getElementById("terminal");
      let lastCommand = "";

      const promptLine = command => {
        const line = document.createElement("div");
        line.className = "prompt-line";
        const prompt = document.createElement("span");
        prompt.className = "prompt";
        prompt.textContent = "xiang@security:~$";
        const value = document.createElement("span");
        value.className = "command";
        value.textContent = command;
        line.append(prompt, value);
        return line;
      };

      const fileList = () => {
        const result = document.createElement("div");
        result.className = "result";
        const list = document.createElement("div");
        list.className = "file-list";
        files.forEach(file => {
          const item = document.createElement("span");
          item.textContent = file;
          list.appendChild(item);
        });
        result.appendChild(list);
        return result;
      };

      const addItem = (command, content) => {
        const item = document.createElement("div");
        item.className = "history-item";
        item.appendChild(promptLine(command));
        if (content) item.appendChild(content);
        output.appendChild(item);
        output.scrollTo({ top: output.scrollHeight, behavior: "smooth" });
      };

      const templateContent = id => document.getElementById(id).content.cloneNode(true);

      const showHome = () => {
        output.replaceChildren();
        addItem("whoami", templateContent("home-template"));
      };

      const showError = command => {
        const message = document.createElement("p");
        message.className = "result error";
        message.textContent = `command not found: ${command}`;
        addItem(command, message);
      };

      const runCommand = raw => {
        const command = raw.trim().replace(/\s+/g, " ");
        if (!command) return;
        lastCommand = command;
        const normalized = command.toLowerCase();

        if (normalized === "whoami") return showHome();
        if (normalized === "ls") return addItem(command, fileList());

        if (normalized.startsWith("cat ")) {
          const requested = normalized.slice(4).trim();
          const file = requested.endsWith(".txt") ? requested : `${requested}.txt`;
          if (files.includes(file)) {
            return addItem(command, templateContent(`${file.replace(".txt", "")}-template`));
          }
        }

        showError(command);
      };

      form.addEventListener("submit", event => {
        event.preventDefault();
        runCommand(input.value);
        input.value = "";
      });

      input.addEventListener("keydown", event => {
        if (event.key === "ArrowUp") {
          event.preventDefault();
          input.value = lastCommand;
        }
        if (event.key === "Tab") {
          event.preventDefault();
          const value = input.value.trim().toLowerCase();
          const matches = completions.filter(item => item.startsWith(value));
          if (matches.length === 1) input.value = matches[0];
        }
      });

      terminal.addEventListener("click", event => {
        if (!event.target.closest("a")) input.focus();
      });

      showHome();
    })();
  </script>
</body>
</html>
