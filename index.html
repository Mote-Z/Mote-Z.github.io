<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Xiang Zhang — cybersecurity researcher and network security engineer.">
  <title>Xiang Zhang</title>
  <style>
    :root {
      --black: #050505;
      --panel: #0b0b0b;
      --raised: #111;
      --white: #f1f1ef;
      --gray: #a1a19d;
      --dim: #62625f;
      --line: #2a2a28;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--black);
    }

    body {
      color: var(--white);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input { font: inherit; }

    a { color: inherit; }

    button:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline: 1px solid var(--white);
      outline-offset: 3px;
    }

    .screen {
      width: 100vw;
      height: 100dvh;
      padding: clamp(12px, 2.5vw, 32px);
      display: grid;
      place-items: center;
      background: var(--black);
    }

    .window {
      width: min(1180px, 100%);
      height: min(760px, 100%);
      display: grid;
      grid-template-rows: 42px 1fr;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    .titlebar {
      padding: 0 16px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      border-bottom: 1px solid var(--line);
      background: var(--raised);
    }

    .titlebar p {
      margin: 0;
      color: var(--gray);
      font-size: 11px;
    }

    .status { justify-self: end; }
    .status::before { content: "[ "; color: var(--dim); }
    .status::after { content: " ]"; color: var(--dim); }

    .window-mark { display: flex; gap: 7px; }

    .window-mark i {
      width: 8px;
      height: 8px;
      border: 1px solid var(--dim);
      border-radius: 50%;
    }

    .terminal {
      min-height: 0;
      padding: clamp(18px, 3vw, 38px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 22px;
    }

    .last-command,
    form label {
      color: var(--gray);
      font-size: 12px;
    }

    .last-command span,
    form label span { color: var(--white); }

    .last-command strong,
    form label strong {
      color: var(--dim);
      font-weight: 400;
    }

    .output-frame {
      min-height: 0;
      display: grid;
      align-items: center;
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }

    .output {
      width: 100%;
      max-height: 100%;
    }

    .output p,
    .output h1,
    .output h2 { margin-top: 0; }

    .welcome .muted:first-child { margin-bottom: 34px; }

    h1 {
      margin-bottom: 10px;
      font-size: clamp(42px, 8vw, 92px);
      font-weight: 500;
      letter-spacing: -0.075em;
      line-height: 0.92;
    }

    .role,
    .muted,
    .copy p,
    .rows p { color: var(--gray); }

    .role {
      margin-bottom: clamp(34px, 6vh, 66px);
      font-size: 13px;
    }

    .welcome-copy {
      max-width: 700px;
      font-size: 14px;
      line-height: 1.7;
    }

    .welcome-copy p { margin-bottom: 10px; }
    .welcome-copy strong { color: var(--white); font-weight: 500; }

    .output-title,
    .label {
      margin-bottom: 26px;
      color: var(--dim);
      font-size: 11px;
    }

    .command-list {
      max-width: 680px;
      border-top: 1px solid var(--line);
    }

    .command-list p {
      margin: 0;
      padding: 10px 0;
      display: grid;
      grid-template-columns: 190px 1fr;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
    }

    .command-list span { color: var(--gray); }

    .hint {
      margin: 22px 0 0;
      color: var(--dim);
      font-size: 10px;
    }

    .two-column {
      display: grid;
      grid-template-columns: minmax(220px, 0.7fr) 1.3fr;
      gap: clamp(30px, 7vw, 90px);
    }

    .two-column h2,
    .publication h2 {
      margin-bottom: 0;
      font-size: clamp(25px, 4vw, 42px);
      font-weight: 500;
      letter-spacing: -0.045em;
      line-height: 1.1;
    }

    .copy { max-width: 650px; }

    .copy p {
      margin-bottom: 14px;
      font-size: 13px;
      line-height: 1.7;
    }

    .rows { border-top: 1px solid var(--line); }

    .rows article {
      padding: 16px 0;
      display: grid;
      align-items: start;
      gap: 18px;
      border-bottom: 1px solid var(--line);
    }

    .research-rows article { grid-template-columns: 34px 250px 1fr; }
    .experience-rows article { grid-template-columns: 100px 230px 1fr; }

    .rows span {
      color: var(--dim);
      font-size: 10px;
    }

    .rows h2 {
      margin-bottom: 0;
      font-size: 12px;
      font-weight: 600;
    }

    .rows p {
      margin-bottom: 0;
      font-size: 12px;
      line-height: 1.55;
    }

    .publication .copy h2 { margin-bottom: 22px; }
    .publication .copy strong { color: var(--white); }

    .publication a,
    .contact-links a {
      color: var(--white);
      font-size: 12px;
      text-underline-offset: 4px;
    }

    .contact-links {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
    }

    .compact { align-self: start; }
    .compact p { font-size: 12px; }

    .controls {
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .quick-commands {
      margin-bottom: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .quick-commands button,
    form button {
      padding: 5px 9px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--gray);
      cursor: pointer;
      font-size: 10px;
    }

    .quick-commands button:hover,
    form button:hover {
      border-color: var(--gray);
      color: var(--white);
    }

    form {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 8px;
    }

    form input {
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--white);
      caret-color: var(--white);
      font-size: 12px;
    }

    form button { padding-inline: 14px; }

    @media (max-width: 720px) {
      .screen { padding: 0; }

      .window {
        width: 100%;
        height: 100%;
        border: 0;
        grid-template-rows: 38px 1fr;
      }

      .titlebar { padding: 0 12px; grid-template-columns: 1fr auto; }
      .titlebar p { font-size: 9px; }
      .status { display: none; }

      .terminal { padding: 16px; gap: 14px; }
      .last-command { font-size: 10px; }
      h1 { font-size: clamp(42px, 17vw, 66px); }
      .role { margin-bottom: 30px; line-height: 1.5; }

      .two-column { grid-template-columns: 1fr; gap: 22px; }
      .two-column h2 { font-size: 27px; }

      .research-rows article,
      .experience-rows article {
        grid-template-columns: 28px 1fr;
        gap: 9px;
      }

      .experience-rows article { grid-template-columns: 80px 1fr; }
      .rows p { grid-column: 2; }
      .rows article { padding: 11px 0; }
      .rows p, .copy p { font-size: 11px; line-height: 1.5; }
      .output-title, .label { margin-bottom: 16px; }

      .quick-commands { gap: 5px; }

      .quick-commands button {
        padding: 4px 6px;
        font-size: 9px;
      }

      form button { display: none; }
      form { grid-template-columns: auto 1fr; }
      form label, form input { font-size: 10px; }
    }

    @media (max-height: 620px) {
      .terminal { gap: 12px; padding-top: 16px; padding-bottom: 16px; }
      .welcome .muted:first-child { margin-bottom: 18px; }
      .role { margin-bottom: 22px; }
      .controls { padding-top: 10px; }
      .quick-commands { margin-bottom: 9px; }
      .rows article { padding: 9px 0; }
    }
  </style>
</head>
<body>
  <main class="screen" id="screen">
    <section class="window" aria-label="Interactive academic terminal">
      <header class="titlebar">
        <div class="window-mark" aria-hidden="true"><i></i><i></i><i></i></div>
        <p>xiang.zhang — bash — 80×24</p>
        <p class="status">online</p>
      </header>

      <div class="terminal">
        <div class="last-command" aria-live="polite">
          <span>xiang@security</span>:<strong>~</strong>$ <b id="shown-command">whoami</b>
        </div>

        <div class="output-frame" aria-live="polite">
          <div id="output" class="output"></div>
        </div>

        <div class="controls">
          <div class="quick-commands" aria-label="Quick commands">
            <button type="button" data-command="cat about.txt">cat about.txt</button>
            <button type="button" data-command="cat research.txt">cat research.txt</button>
            <button type="button" data-command="cat publication.txt">cat publication.txt</button>
            <button type="button" data-command="cat experience.txt">cat experience.txt</button>
            <button type="button" data-command="cat contacts.txt">cat contacts.txt</button>
          </div>

          <form id="command-form">
            <label for="terminal-input">
              <span>xiang@security</span>:<strong>~</strong>$
            </label>
            <input
              id="terminal-input"
              autocomplete="off"
              spellcheck="false"
              aria-label="Terminal command"
            >
            <button type="submit">run</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script>
    const commands = [
      "help",
      "cat about.txt",
      "cat research.txt",
      "cat publication.txt",
      "cat experience.txt",
      "cat contacts.txt",
      "clear"
    ];

    const views = {
      welcome: `
        <div class="welcome">
          <p class="muted">Last login: today on academic-portfolio</p>
          <h1>Xiang Zhang</h1>
          <p class="role">Cybersecurity researcher / Network security engineer</p>
          <div class="welcome-copy">
            <p>I work on attack-surface analysis, network and systems security, and AI-assisted security analysis.</p>
            <p class="muted">Type <strong>help</strong> or read a file from the command bar.</p>
          </div>
        </div>`,

      help: `
        <p class="output-title">Available commands</p>
        <div class="command-list">
          <p><strong>cat about.txt</strong><span>short profile and background</span></p>
          <p><strong>cat research.txt</strong><span>current research interests</span></p>
          <p><strong>cat publication.txt</strong><span>selected publication</span></p>
          <p><strong>cat experience.txt</strong><span>selected professional work</span></p>
          <p><strong>cat contacts.txt</strong><span>academic and professional links</span></p>
          <p><strong>clear</strong><span>clear the current output</span></p>
        </div>
        <p class="hint">Tip: use ↑ to recall the last command and Tab to complete.</p>`,

      about: `
        <div class="two-column">
          <div>
            <p class="label">about.txt</p>
            <h2>Research informed by practice.</h2>
          </div>
          <div class="copy">
            <p>My background includes knowledge-graph-based asset discovery, enterprise network security, CTF competitions, and vulnerability analysis.</p>
            <p>M.Sc. in Cybersecurity, University of Chinese Academy of Sciences. B.Sc. in Cybersecurity, Central South University.</p>
            <p>Network Security Engineer at E Fund Management and former member of the CTF team Never Stop Exploiting.</p>
          </div>
        </div>`,

      research: `
        <p class="label">research.txt</p>
        <div class="rows research-rows">
          <article>
            <span>01</span>
            <h2>attack-surface-analysis</h2>
            <p>Cross-layer analysis of exposure, reachability, identity, vulnerabilities, and security controls.</p>
          </article>
          <article>
            <span>02</span>
            <h2>ai-for-security</h2>
            <p>Using AI to interpret heterogeneous security data while grounding conclusions in system evidence.</p>
          </article>
          <article>
            <span>03</span>
            <h2>attack-path-reasoning</h2>
            <p>Studying how infrastructure state and application behavior combine to form practical attack paths.</p>
          </article>
        </div>`,

      publication: `
        <div class="two-column publication">
          <div>
            <p class="label">publication.txt</p>
            <p class="muted">ICA3PP 2021 · Springer</p>
          </div>
          <div class="copy">
            <h2>Auto-Recon: An Automated Network Reconnaissance System Based on Knowledge Graph</h2>
            <p><strong>Xiang Zhang</strong>, Qingli Guo, Yuan Liu, and Xiaorui Gong</p>
            <p>A knowledge-graph-based approach to automated asset discovery and network reconnaissance.</p>
            <a href="https://doi.org/10.1007/978-3-030-95391-1_7" target="_blank" rel="noreferrer">open paper ↗</a>
          </div>
        </div>`,

      experience: `
        <p class="label">experience.txt</p>
        <div class="rows experience-rows">
          <article><span>2024—now</span><h2>attack-surface governance</h2><p>Multi-layer security modeling for exposure validation and remediation planning.</p></article>
          <article><span>2023—now</span><h2>network security automation</h2><p>Reachability analysis, topology modeling, and policy lifecycle automation.</p></article>
          <article><span>2025—now</span><h2>zero-trust access</h2><p>Identity-aware access and Single Packet Authorization.</p></article>
          <article><span>2022—23</span><h2>active-directory security</h2><p>Attack-path modeling and defensive hardening.</p></article>
        </div>`,

      contact: `
        <div class="two-column">
          <div>
            <p class="label">contacts.txt</p>
            <h2>Find me online.</h2>
          </div>
          <div class="contact-links">
            <a href="https://scholar.google.com/citations?user=PVjI030AAAAJ&amp;hl=en" target="_blank" rel="noreferrer">google-scholar ↗</a>
            <a href="https://github.com/Mote-Z" target="_blank" rel="noreferrer">github ↗</a>
            <a href="https://www.linkedin.com/in/xiang-zhang-moteorz/" target="_blank" rel="noreferrer">linkedin ↗</a>
            <a href="mailto:mote.orzzz@gmail.com">mote.orzzz@gmail.com</a>
          </div>
        </div>`
    };

    const routes = {
      "whoami": "about",
      "cat about": "about",
      "cat about.txt": "about",
      "cat research": "research",
      "cat research.txt": "research",
      "cat publication": "publication",
      "cat publication.txt": "publication",
      "cat experience": "experience",
      "cat experience.txt": "experience",
      "cat contacts": "contact",
      "cat contacts.txt": "contact",
      "help": "help",
      "man": "help",
      "ls": "help",
      "clear": "clear"
    };

    const output = document.getElementById("output");
    const input = document.getElementById("terminal-input");
    const shownCommand = document.getElementById("shown-command");
    const form = document.getElementById("command-form");
    let lastCommand = "";

    function normalize(value) {
      return value.trim().toLowerCase().replace(/\s+/g, " ");
    }

    function run(raw) {
      const command = normalize(raw);
      if (!command) return;

      shownCommand.textContent = command;
      lastCommand = command;
      input.value = "";

      const route = routes[command];
      if (route === "clear") {
        output.innerHTML = "";
      } else if (route && views[route]) {
        output.innerHTML = views[route];
      } else {
        output.innerHTML = `
          <div class="compact">
            <p>bash: ${escapeHtml(command)}: command not found</p>
            <p class="muted">Type 'help' to list available commands.</p>
          </div>`;
      }
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[character]);
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      run(input.value);
    });

    input.addEventListener("keydown", event => {
      if (event.key === "ArrowUp") {
        event.preventDefault();
        input.value = lastCommand;
      }

      if (event.key === "Tab") {
        event.preventDefault();
        const value = normalize(input.value);
        const match = commands.find(command => command.startsWith(value));
        if (match) input.value = match;
      }
    });

    document.querySelectorAll("[data-command]").forEach(button => {
      button.addEventListener("click", () => run(button.dataset.command));
    });

    document.getElementById("screen").addEventListener("click", event => {
      if (!event.target.closest("a, button")) input.focus();
    });

    output.innerHTML = views.welcome;
    input.focus();
  </script>
</body>
</html>
